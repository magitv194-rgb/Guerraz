name: Compilar APK Guerraz
on:
  push:
    branches: [ main, android-remote-control ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK Host y Client
        run: gradle --no-daemon assembleHostDebug assembleClientDebug
      - name: Publicar APKs
        uses: actions/upload-artifact@v4
        with:
          name: Guerraz-Android-APKs
          path: |
            app/build/outputs/apk/host/debug/*.apk
            app/build/outputs/apk/client/debug/*.apk
          if-no-files-found: error
          retention-days: 30
