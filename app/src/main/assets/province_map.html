<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1f2e25}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="provinceMap" aria-label="Mapa geográfico de las provincias argentinas"></canvas>
<script>
(()=>{"use strict";
const canvas=document.getElementById("provinceMap"),ctx=canvas.getContext("2d");
const API="https://apis.datos.gob.ar/georef/api/v2.0/provincias.geojson";
let features=[],paths=[],extent=null,selected="Ciudad Autónoma de Buenos Aires";
let zoom=1,offsetX=0,offsetY=0,pointer=null,dragged=false,suppressClick=false;const activePointers=new Map();let pinch=null;
const polygons=g=>!g?[]:g.type==="Polygon"?[g.coordinates]:g.type==="MultiPolygon"?g.coordinates:[];
function visit(f,fn){polygons(f.geometry).forEach(poly=>poly.forEach(ring=>ring.forEach(fn)));}
function getBounds(list){let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;list.forEach(f=>visit(f,([x,y])=>{a=Math.min(a,x);c=Math.max(c,x);b=Math.min(b,y);d=Math.max(d,y);}));return{minX:a,minY:b,maxX:c,maxY:d};}
function project(pt,w,h){const pad=24,bw=extent.maxX-extent.minX,bh=extent.maxY-extent.minY,s=Math.min((w-pad*2)/bw,(h-pad*2)/bh),dw=bw*s,dh=bh*s;return{x:(w-dw)/2+(pt[0]-extent.minX)*s,y:(h-dh)/2+(extent.maxY-pt[1])*s};}
function makePath(f,w,h){const p=new Path2D();polygons(f.geometry).forEach(poly=>poly.forEach(ring=>{if(!ring.length)return;let q=project(ring[0],w,h);p.moveTo(q.x,q.y);for(let i=1;i<ring.length;i++){q=project(ring[i],w,h);p.lineTo(q.x,q.y);}p.closePath();}));return p;}
function center(f){const b=getBounds([f]);return[(b.minX+b.maxX)/2,(b.minY+b.maxY)/2];}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(w/2+offsetX,h/2+offsetY);ctx.scale(zoom,zoom);ctx.translate(-w/2,-h/2);ctx.fillStyle="#1f2e25";ctx.fillRect(-w*2,-h*2,w*5,h*5);
features.forEach((f,i)=>{const name=f.properties?.nombre||f.properties?.name||"Provincia",isSelected=name===selected;ctx.fillStyle=isSelected?"#c49b48":"#527653";ctx.strokeStyle=isSelected?"#ffe09a":"#c2c9ad";ctx.lineWidth=isSelected?2.4:1.15;ctx.fill(paths[i]);ctx.stroke(paths[i]);const c=project(center(f),w,h);ctx.save();ctx.fillStyle="#f6f2df";ctx.font="600 10px system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.shadowColor="#18231b";ctx.shadowBlur=3;ctx.fillText(name.toLocaleUpperCase("es-AR"),c.x,c.y,Math.max(22,Math.min(118,w*.22)));ctx.restore();});
ctx.restore();}
function resize(){const r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);draw();}
function hit(x,y){const w=canvas.clientWidth,h=canvas.clientHeight,bx=(x-w/2-offsetX)/zoom+w/2,by=(y-h/2-offsetY)/zoom+h/2;for(let i=features.length-1;i>=0;i--){if(ctx.isPointInPath(paths[i],bx,by)){const name=features[i].properties?.nombre||features[i].properties?.name;if(name)return name;}}return null;}
function zoomAt(factor,x,y){const w=canvas.clientWidth,h=canvas.clientHeight,old=zoom,next=Math.max(1,Math.min(8,zoom*factor));const bx=(x-w/2-offsetX)/old+w/2,by=(y-h/2-offsetY)/old+h/2;zoom=next;offsetX=x-w/2-(bx-w/2)*zoom;offsetY=y-h/2-(by-h/2)*zoom;draw();}
canvas.addEventListener("pointerdown",e=>{canvas.setPointerCapture(e.pointerId);activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(activePointers.size===1){pointer={x:e.clientX,y:e.clientY,ox:offsetX,oy:offsetY};dragged=false;}else if(activePointers.size===2){const pts=[...activePointers.values()],dx=pts[1].x-pts[0].x,dy=pts[1].y-pts[0].y,r=canvas.getBoundingClientRect(),mx=(pts[0].x+pts[1].x)/2-r.left,my=(pts[0].y+pts[1].y)/2-r.top,w=canvas.clientWidth,h=canvas.clientHeight;pinch={distance:Math.hypot(dx,dy),zoom,worldX:(mx-w/2-offsetX)/zoom+w/2,worldY:(my-h/2-offsetY)/zoom+h/2};pointer=null;dragged=true;}});
canvas.addEventListener("pointermove",e=>{if(!activePointers.has(e.pointerId))return;activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(activePointers.size>=2&&pinch){const pts=[...activePointers.values()],dx=pts[1].x-pts[0].x,dy=pts[1].y-pts[0].y,dist=Math.max(1,Math.hypot(dx,dy)),r=canvas.getBoundingClientRect(),mx=(pts[0].x+pts[1].x)/2-r.left,my=(pts[0].y+pts[1].y)/2-r.top,w=canvas.clientWidth,h=canvas.clientHeight;zoom=Math.max(1,Math.min(8,pinch.zoom*dist/pinch.distance));offsetX=mx-w/2-(pinch.worldX-w/2)*zoom;offsetY=my-h/2-(pinch.worldY-h/2)*zoom;draw();return;}if(!pointer)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;if(Math.abs(dx)+Math.abs(dy)>5)dragged=true;if(dragged){offsetX=pointer.ox+dx;offsetY=pointer.oy+dy;draw();}});
function endPointer(e){activePointers.delete(e.pointerId);if(activePointers.size<2)pinch=null;if(activePointers.size===0){if(dragged)suppressClick=true;pointer=null;}}
canvas.addEventListener("pointerup",endPointer);canvas.addEventListener("pointercancel",endPointer);
canvas.addEventListener("click",e=>{if(suppressClick){suppressClick=false;return;}const r=canvas.getBoundingClientRect(),name=hit(e.clientX-r.left,e.clientY-r.top);if(name){selected=name;draw();if(window.GuerraBridge)GuerraBridge.onProvinceSelected(name);}});
canvas.addEventListener("wheel",e=>{e.preventDefault();const r=canvas.getBoundingClientRect();zoomAt(e.deltaY<0?1.18:1/1.18,e.clientX-r.left,e.clientY-r.top);},{passive:false});
canvas.addEventListener("dblclick",e=>{const r=canvas.getBoundingClientRect();zoomAt(1.5,e.clientX-r.left,e.clientY-r.top);});
window.addEventListener("resize",resize);
async function init(){try{const response=await fetch(API,{cache:"force-cache"});if(!response.ok)throw new Error("HTTP "+response.status);const data=await response.json();features=data.features||[];if(!features.length)throw new Error("La API no devolvió provincias");extent=getBounds(features);paths=features.map(f=>makePath(f,canvas.clientWidth,canvas.clientHeight));resize();}catch(error){ctx.fillStyle="#f3d58c";ctx.font="14px sans-serif";ctx.fillText("No se pudo cargar el mapa Georef.",18,32);ctx.font="11px sans-serif";ctx.fillText("Comprueba la conexión a Internet.",18,52);}}
init();
})();
</script>
</body>
</html>
